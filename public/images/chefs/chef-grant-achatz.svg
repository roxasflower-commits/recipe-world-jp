    <path d="M 240 256 L 206 300 L 240 330 L 274 300 Z" stroke-opacity="0.8"/>
    <circle cx="240" cy="352" r="3.5" fill="#FAF8F4" stroke="none"/>
    <circle cx="240" cy="384" r="3.5" fill="#FAF8F4" stroke="none"/>
    <circle cx="240" cy="416" r="3.5" fill="#FAF8F4" stroke="none"/>
  </g>

  <path d="M 210 440 L 270 440" stroke="#FAF8F4" stroke-opacity="0.3" stroke-width="1"/>
</svg>
